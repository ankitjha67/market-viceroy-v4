# Optional observability overlay (Phase 14, QuantDinger-style): Prometheus
# scraping the API's /metrics + Grafana on top. Entirely optional — the paper
# platform runs without it. Loopback-only ports, no default credentials
# (Grafana admin password comes from .env).
#
#   docker compose -f docker-compose.observability.yml up -d
#
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mv-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # loopback-only

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mv-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/mv.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # loopback-only; the deck owns :3000

volumes:
  prometheus-data:
  grafana-data:
